project:
  type: website
  output-dir: _site

website:
  title: "Andree Valle Campos"
  site-url: https://avallecam.github.io
  description: "Andree Valle-Campos — epidemiologist and R developer making outbreak analytics accessible through teaching and open science."
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Vitae
        menu:
          - bio.qmd
          - publications.qmd
          - resources.qmd
          - text: Workshops
            href: blog/index.qmd#category=Workshop
          - text: Lectures
            href: blog/index.qmd#category=Lecture
          - text: Talks
            href: blog/index.qmd#category=Talk
      - href: blog/index.qmd
        text: Blog
      - href: about.qmd
        text: About
    right:
      - icon: envelope
        href: mailto:andree.valle-campos@outlook.com
        aria-label: Email
      - icon: github
        href: https://github.com/avallecam
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/avallecam/
        aria-label: LinkedIn
